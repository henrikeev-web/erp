services:
  nginx:
    image: nginx:alpine
    container_name: banguelas-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/public/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: banguelas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # dev local; em servidor defina POSTGRES_PASSWORD no ambiente
      POSTGRES_DB: delivery_erp
    ports:
      - "127.0.0.1:5432:5432" # só a própria máquina; nunca publicar o banco na rede
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: banguelas-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Sobrescreve o DATABASE_URL do .env para usar o hostname do container
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery_erp
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000" # acesso pelo nginx (porta 80); a 3000 fica só local
    volumes:
      # Uploads persistidos em pasta local — sobrevive a reinstalação do Docker
      - ./public/uploads:/app/public/uploads
      # Certificado A1 para NFS-e (crie a pasta certs/ com o .pfx antes de subir)
      - ./certs:/app/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
